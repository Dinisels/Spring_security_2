<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
</head>
<body>
<h1>Welcome to Spring Security Demo</h1>

<div th:if="${#authentication != null and #authentication.isAuthenticated()}">
    <p>You are logged in as: <span th:text="${#authentication.name}"></span></p>
    <a th:href="@{/user}">User Page</a> |
    <a th:href="@{/admin}">Admin Page</a> |
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Logout</button>
    </form>
</div>

<div th:unless="${#authentication != null and #authentication.isAuthenticated()}">
    <a th:href="@{/login}">Login</a>
</div>
</body>
</html>
