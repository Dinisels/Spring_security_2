<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить нового пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>ДОБАВИТЬ НОВОГО ПОЛЬЗОВАТЕЛЯ</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/admin/add}" method="post" th:object="${user}">
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя *</label>
            <input type="text" class="form-control" id="username" name="username" th:field="*{username}" required>
            <div class="form-text">Отображаемое имя пользователя</div>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Возраст *</label>
            <input type="number" class="form-control" id="age" name="age" th:field="*{age}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email *</label>
            <input type="email" class="form-control" id="email" name="email" th:field="*{email}" required>
            <div class="form-text">Email будет использоваться как логин</div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Пароль *</label>
            <input type="password" class="form-control" id="password" name="password" th:field="*{password}" required minlength="6">
            <div class="form-text">Минимум 6 символов</div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Подтверждение пароля *</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Роли</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="USER" id="roleUser">
                <label class="form-check-label" for="roleUser">
                    ROLE_USER
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="ADMIN" id="roleAdmin">
                <label class="form-check-label" for="roleAdmin">
                    ROLE_ADMIN
                </label>
            </div>
            <div class="form-text">Выберите роли для пользователя</div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="/admin" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
