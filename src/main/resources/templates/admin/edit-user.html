<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>РЕДАКТИРОВАТЬ ПОЛЬЗОВАТЕЛЯ</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="mb-3">
        <strong>ID:</strong> <span th:text="${user.id}">1</span>
    </div>

    <div class="mb-3">
        <strong>Текущий email:</strong> <span th:text="${user.email}">user@example.com</span>
    </div>

    <form th:action="@{/admin/edit/{id}(id=${user.id})}" method="post" th:object="${user}">
        <div class="mb-3">
            <label for="name" class="form-label">Имя пользователя *</label>
            <input type="text" class="form-control" id="name" name="name" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Возраст *</label>
            <input type="number" class="form-control" id="age" name="age" th:field="*{age}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Новый Email (логин) *</label>
            <input type="email" class="form-control" id="email" name="email" th:field="*{email}" required>
            <div class="form-text">Email будет использоваться как логин</div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Новый пароль (оставьте пустым, если не меняется)</label>
            <input type="password" class="form-control" id="password" name="password" th:field="*{password}" minlength="6">
            <div class="form-text">Минимум 6 символов. Оставьте пустым, чтобы не менять пароль</div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Подтверждение пароля</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword">
        </div>

        <div class="mb-3">
            <label class="form-label">Роли</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="ROLE_USER"
                       id="roleUser" th:checked="${#lists.contains(user.roles, 'ROLE_USER')}">
                <label class="form-check-label" for="roleUser">
                    ROLE_USER
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="ROLE_ADMIN"
                       id="roleAdmin" th:checked="${#lists.contains(user.roles, 'ROLE_ADMIN')}">
                <label class="form-check-label" for="roleAdmin">
                    ROLE_ADMIN
                </label>
            </div>
            <div class="form-text">Выберите роли для пользователя</div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a th:href="@{/admin}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
