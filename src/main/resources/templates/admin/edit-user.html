<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>РЕДАКТИРОВАТЬ ПОЛЬЗОВАТЕЛЯ</h1>

    <!-- Сообщения об ошибках/успехе -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Убрали th:object="${user}" -->
    <form th:action="@{/admin/edit/{id}(id=${user.id})}" method="post">

        <!-- Поле username -->
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя *</label>
            <input type="text" class="form-control" id="username" name="username"
                   th:value="${user.username}" required>
            <div class="form-text">Отображаемое имя пользователя</div>
        </div>

        <!-- Поле age -->
        <div class="mb-3">
            <label for="age" class="form-label">Возраст *</label>
            <input type="number" class="form-control" id="age" name="age"
                   th:value="${user.age}" required>
        </div>

        <!-- Поле email -->
        <div class="mb-3">
            <label for="email" class="form-label">Email *</label>
            <input type="email" class="form-control" id="email" name="email"
                   th:value="${user.email}" required>
            <div class="form-text">Email будет использоваться как логин</div>
        </div>

        <!-- Поле password (необязательное при редактировании) -->
        <div class="mb-3">
            <label for="password" class="form-label">Новый пароль (оставьте пустым, чтобы не менять)</label>
            <input type="password" class="form-control" id="password" name="password" minlength="6">
            <div class="form-text">Минимум 6 символов. Оставьте пустым, если не хотите менять пароль</div>
        </div>

        <!-- Поле confirmPassword (необязательное) -->
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Подтверждение нового пароля</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword">
        </div>

        <!-- Роли (чекбоксы) -->
        <div class="mb-3">
            <label class="form-label">Роли</label>

            <!-- ROLE_USER -->
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="USER" id="roleUser">
                <label class="form-check-label" for="roleUser">
                    ROLE_USER
                </label>
            </div>

            <!-- ROLE_ADMIN -->
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="roles" value="ADMIN" id="roleAdmin">
                <label class="form-check-label" for="roleAdmin">
                    ROLE_ADMIN
                </label>
            </div>

            <div class="form-text">Выберите роли для пользователя</div>
        </div>

        <!-- Кнопки -->
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a href="/admin" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript для установки чекбоксов -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        // Получаем роли пользователя
        var userRoles = [[${user.roles}]];

        if (userRoles) {
            // Проверяем каждую роль
            userRoles.forEach(function(role) {
                if (role.name === 'USER') {
                    document.getElementById('roleUser').checked = true;
                }
                if (role.name === 'ADMIN') {
                    document.getElementById('roleAdmin').checked = true;
                }
            });
        }
    });
    /*]]>*/
</script>
</body>
</html>
