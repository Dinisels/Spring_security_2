<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .page-wrapper {
            flex: 1;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-xl navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">
            <strong th:text="${#authentication.name}">admin@mail.ru</strong>
            with roles:
            <span th:each="authority, iterStat : ${#authentication.authorities}">
                <span th:text="${#strings.startsWith(authority.authority, 'ROLE_')
                    ? authority.authority.substring(5)
                    : authority.authority}">
                </span>
                <span th:if="${!iterStat.last}">, </span>
            </span>
        </span>

        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-dark">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-fluid page-wrapper">
    <div class="row h-100">

        <!-- Левая навигация -->
        <aside class="col-2 bg-white pt-3">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active"
                   data-bs-toggle="pill"
                   href="#admin-content">
                    Admin
                </a>

                <a class="nav-link"
                   data-bs-toggle="pill"
                   href="#user-content">
                    User
                </a>
            </div>
        </aside>

        <main class="col-10 bg-light pt-3">
            <div class="tab-content">

                <!-- Admin -->
                <section class="tab-pane fade show active" id="admin-content">
                    <h2>Admin panel</h2>

                    <!-- Это обычные ссылки, потому что данные для форм приходят из отдельных GET-методов -->
                    <nav class="nav nav-tabs mb-3">
                        <a th:href="@{/admin/user}"
                           class="nav-link"
                           th:classappend="${newUser == null and existingUser == null} ? ' active'">
                            User table
                        </a>

                        <a th:href="@{/admin/user/new}"
                           class="nav-link"
                           th:classappend="${newUser != null} ? ' active'">
                            Add user
                        </a>
                    </nav>

                    <!-- Таблица пользователей показывается на главной странице и на странице редактирования -->
                    <div th:if="${newUser == null}" class="card mb-4">
                        <div class="card-header">
                            All users
                        </div>

                        <div class="card-body">
                            <table class="table table-striped align-middle">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Roles</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.name}"></td>
                                    <td th:text="${user.age}"></td>
                                    <td th:text="${user.email}"></td>

                                    <td>
                                        <span th:each="role, iterStat : ${user.roles}">
                                            <span th:text="${#strings.startsWith(role.name, 'ROLE_')
                                                ? role.name.substring(5)
                                                : role.name}">
                                            </span>
                                            <span th:if="${!iterStat.last}">, </span>
                                        </span>
                                    </td>

                                    <td>
                                        <a class="btn btn-info"
                                           th:href="@{/admin/user/{id}/edit(id=${user.id})}">
                                            Edit
                                        </a>
                                    </td>

                                    <td>
                                        <button type="button"
                                                class="btn btn-danger"
                                                data-bs-toggle="modal"
                                                th:attr="data-bs-target='#deleteModal' + ${user.id}">
                                            Delete
                                        </button>

                                        <!-- DELETE /admin/{id} -->
                                        <div class="modal fade"
                                             th:id="'deleteModal' + ${user.id}"
                                             tabindex="-1"
                                             aria-hidden="true">
                                            <div class="modal-dialog">
                                                <div class="modal-content">
                                                    <div class="modal-header">
                                                        <h5 class="modal-title">Delete user</h5>
                                                        <button type="button"
                                                                class="btn-close"
                                                                data-bs-dismiss="modal"
                                                                aria-label="Close">
                                                        </button>
                                                    </div>

                                                    <div class="modal-body">
                                                        <p>
                                                            Delete user
                                                            <strong th:text="${user.name}"></strong>
                                                            with ID
                                                            <strong th:text="${user.id}"></strong>?
                                                        </p>
                                                    </div>

                                                    <div class="modal-footer">
                                                        <button type="button"
                                                                class="btn btn-secondary"
                                                                data-bs-dismiss="modal">
                                                            Close
                                                        </button>

                                                        <form th:action="@{/admin/user/{id}(id=${user.id})}"
                                                              method="post">
                                                            <input type="hidden"
                                                                   name="_method"
                                                                   value="delete">

                                                            <button type="submit"
                                                                    class="btn btn-danger">
                                                                Delete
                                                            </button>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Форма редактирования появляется только после GET /admin/{userId}/edit -->
                    <div th:if="${existingUser != null}" class="card mb-4">
                        <div class="card-header">
                            Edit user
                        </div>

                        <div class="card-body">
                            <form th:action="@{/admin/user/{id}(id=${existingUser.id})}"
                                  th:object="${existingUser}"
                                  method="post">

                                <input type="hidden" name="_method" value="put">

                                <div class="mb-3 text-center">
                                    <label for="editId" class="form-label">ID</label>
                                    <input id="editId"
                                           type="number"
                                           class="form-control w-50 mx-auto"
                                           th:value="*{id}"
                                           disabled>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="editName" class="form-label">First name</label>
                                    <input id="editName"
                                           type="text"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{name}"
                                           minlength="2"
                                           maxlength="50"
                                           pattern="[A-Za-zА-Яа-яЁё\s]+"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="editAge" class="form-label">Age</label>
                                    <input id="editAge"
                                           type="number"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{age}"
                                           min="0"
                                           max="120"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="editEmail" class="form-label">Email</label>
                                    <input id="editEmail"
                                           type="email"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{email}"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="editPassword" class="form-label">Password</label>
                                    <input id="editPassword"
                                           type="password"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{password}"
                                           minlength="5"
                                           maxlength="50">
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="selectedRoles" class="form-label">Roles</label>
                                    <select id="selectedRoles"
                                            name="selectedRoles"
                                            class="form-select w-50 mx-auto"
                                            multiple
                                            size="2">
                                        <option th:each="role : ${roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name}"
                                                th:selected="${#lists.contains(existingUser.roles, role)}">
                                        </option>
                                    </select>
                                </div>

                                <div class="text-center">
                                    <a th:href="@{/admin/user}" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-primary">Edit</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Форма создания появляется только после GET /admin/new -->
                    <div th:if="${newUser != null}" class="card mb-4">
                        <div class="card-header">
                            Add new user
                        </div>

                        <div class="card-body">
                            <!-- POST /admin -->
                            <form th:action="@{/admin/user}"
                                  th:object="${newUser}"
                                  method="post">

                                <div class="mb-3 text-center">
                                    <label for="newName" class="form-label">First name</label>
                                    <input id="newName"
                                           type="text"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{name}"
                                           minlength="2"
                                           maxlength="50"
                                           pattern="[A-Za-zА-Яа-яЁё\s]+"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="newAge" class="form-label">Age</label>
                                    <input id="newAge"
                                           type="number"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{age}"
                                           min="0"
                                           max="120"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="newEmail" class="form-label">Email</label>
                                    <input id="newEmail"
                                           type="email"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{email}"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="newPassword" class="form-label">Password</label>
                                    <input id="newPassword"
                                           type="password"
                                           class="form-control w-50 mx-auto"
                                           th:field="*{password}"
                                           minlength="5"
                                           maxlength="50"
                                           required>
                                </div>

                                <div class="mb-3 text-center">
                                    <label for="newRoles" class="form-label">Roles</label>
                                    <select id="newRoles"
                                            name="newRoles"
                                            class="form-select w-50 mx-auto"
                                            multiple
                                            size="2"
                                            required>
                                        <option th:each="role : ${roles}"
                                                th:value="${role.id}"
                                                th:text="${role.name}">
                                        </option>
                                    </select>
                                </div>

                                <div class="text-center">
                                    <a th:href="@{/admin/user}" class="btn btn-secondary">Cancel</a>
                                    <button type="submit" class="btn btn-success">Add new user</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>

                <!-- User -->
                <section class="tab-pane fade" id="user-content">
                    <h2>User information-page</h2>

                    <div class="card">
                        <div class="card-header">
                            About user
                        </div>

                        <div class="card-body">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Roles</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:if="${#authentication != null}">
                                    <td th:text="${#authentication.principal.id}"></td>
                                    <td th:text="${#authentication.principal.name}"></td>
                                    <td th:text="${#authentication.principal.age}"></td>
                                    <td th:text="${#authentication.principal.email}"></td>
                                    <td>
                                        <span th:each="role, iterStat : ${#authentication.principal.roles}">
                                            <span th:text="${#strings.startsWith(role.name, 'ROLE_')
                                                ? role.name.substring(5)
                                                : role.name}">
                                            </span>
                                            <span th:if="${!iterStat.last}">, </span>
                                        </span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
